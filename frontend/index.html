<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudGuard AI</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
    <script src="./js/app.js"></script>
  </head>
  <body>
    <div class="app-layout">
      <header class="app-header">
        <h1>CloudGuard AI</h1>
      </header>

      <aside class="sidebar" aria-label="API Actions">
        <h2>Actions</h2>
        <button type="button" id="btnAttackPath">/attack-path</button>
        <button type="button" id="btnAllPaths">/all-paths</button>
        <button type="button" id="btnRiskScore">/risk-score</button>
        <button type="button" id="btnPredictCompromise">/predict-compromise</button>
        <button type="button" id="btnAssetAnalysis">/asset-analysis</button>
      </aside>

      <main class="content" aria-label="CloudGuard dashboard">

        <div class="dashboard-row top-row" aria-label="Top dashboard panels">
          <section class="dashboard-card" aria-label="Risk dashboard panel">
            <h2>Risk Dashboard</h2>
            <p>Risk score will appear here</p>
          </section>

          <section class="dashboard-card" aria-label="Prediction panel">
            <h2>Prediction Panel</h2>
            <p>Predicted targets will appear here</p>
          </section>
        </div>

        <!-- 🔥 GRAPH SECTION UPDATED -->
        <section class="dashboard-card graph-card" aria-label="Attack graph">
          <h2>Attack Graph</h2>

          <!-- Graph Controls -->
          <div class="graph-controls">
            <button type="button" id="zoom-in">+</button>
            <button type="button" id="zoom-out">−</button>
            <button type="button" id="fit-graph">Fit</button>
            <button type="button" id="reset-graph">Reset</button>
          </div>

          <!-- Graph Container -->
          <div id="cy" style="width: 100%; height: 500px;"></div>
        </section>

        <div class="dashboard-row bottom-row" aria-label="Bottom dashboard panels">
          <section class="dashboard-card" aria-label="Asset details panel">
            <h2>Asset Details</h2>
            <p>Select a node to view details</p>
          </section>

          <section class="dashboard-card" aria-label="Mitigation suggestions panel">
            <h2>Mitigation Suggestions</h2>
            <p>Recommendations will appear here</p>
          </section>
        </div>

        <div id="status-output" class="status-bar" aria-live="polite">
          System ready. Waiting for analysis updates.
        </div>
      </main>
    </div>
  </body>
</html>
